<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dawnward · Memory Galaxy</title>
<meta name="description" content="Prototype C: your evenings as a galaxy you can walk through, on a screen or in a headset. The same data as the app's list and sky.">
<meta name="theme-color" content="#04060A">
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --void:#04060A; --surface:#12161D; --raised:#171C25; --line:#232A34; --ink:#ECE9E2; --dim:#9AA0A9; --faint:#79818F; --gold:#C9A96A; --danger:#C47A73;
    --display:"Source Serif 4", Georgia, serif; --body:"Source Sans 3", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--void); color: var(--ink); font-family: var(--body); }
  body { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
  :focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--display); font-weight: 400; font-size: 22px; }
  .meta { color: var(--dim); font-size: 14px; }
  .sample { color: var(--gold); font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(0,1fr) 360px; min-height: 0; }
  #stage { position: relative; min-height: 360px; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #vr { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); }
  aside { border-left: 1px solid var(--line); overflow: auto; padding: 16px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
  .toggle { color: var(--gold); font-size: 15px; padding: 6px 0; text-align: left; }
  /* Always rendered so the live region is in place before the first change. */
  #panel:not(.on) { padding: 0; border: 0; }
  #panel.on { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  #vr button:focus-visible, #vr a:focus-visible { outline: 2px solid var(--gold) !important; outline-offset: 3px; }
  #panel .when { color: var(--faint); font-size: 13px; }
  #panel q, #panel .statement { display: block; font-family: var(--display); font-size: 19px; line-height: 1.35; margin: 8px 0; }
  #panel .why { color: var(--dim); font-size: 14px; line-height: 1.45; }
  #panel button { color: var(--gold); font-size: 15px; padding: 6px 0; margin-top: 6px; text-align: left; display: block; }
  ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li button { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  li button[aria-pressed="true"] { border-color: var(--gold); }
  li .when { display: block; color: var(--faint); font-size: 13px; }
  li .text { display: block; color: var(--ink); font-size: 15px; line-height: 1.4; margin-top: 2px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--dim); letter-spacing: .02em; margin-top: 6px; }
  .note { color: var(--dim); font-size: 14px; line-height: 1.45; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Memory Galaxy</h1>
    <p class="meta" id="source">Loading…</p>
  </div>
  <p class="note">Each star is an evening. A line joins two evenings that support the same belief.</p>
</header>
<main>
  <div id="stage"><div id="vr"></div></div>
  <aside>
    <div id="panel" aria-live="polite"></div>
    <h2 id="themes-h">What the evenings support</h2>
    <ul id="themes" aria-labelledby="themes-h"></ul>
    <h2 id="stars-h">Evenings</h2>
    <ul id="stars" aria-labelledby="stars-h"></ul>
  </aside>
</main>
<script src="galaxy.js"></script>
</body>
</html>
